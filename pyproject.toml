[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssu-lms-mcp"
version = "0.1.0"
description = "숭실대학교 LMS 공지·과제·강의자료를 제공하는 독립 MCP 서버"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.26,<2",
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "beautifulsoup4>=4.12,<5",
    "playwright>=1.44,<2",
    "loguru>=0.7,<1",
    "filelock>=3.16,<4",
    "pypdf>=6,<7",
    "python-pptx>=1,<2",
    "python-docx>=1.1,<2",
    "pymupdf>=1.26,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2,<10", "pytest-asyncio>=1,<2", "ruff>=0.12", "build>=1.2"]

[project.scripts]
ssu-lms-mcp = "ssu_lms_mcp.cli:main"
ssu-study = "ssu_lms_mcp.study_cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ssu_lms_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/ssu_lms_mcp/**/*.py",
    "/src/ssu_lms_mcp/artifact_web/**/*",
    "/scripts/*.py",
    "/tests/*.py",
    "/examples/*.json",
    "/README.md",
    "/RECOVERY.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

# The bootstrap must report an unsupported Python before installing the package.
[tool.ruff.per-file-target-version]
"scripts/setup.py" = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
